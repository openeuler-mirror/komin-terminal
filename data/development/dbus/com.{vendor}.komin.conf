<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.{vendor}.komin"/>
    <allow send_destination="com.{vendor}.komin"/>
    <allow receive_sender="com.{vendor}.komin"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.{vendor}.komin.chat"/>
    <allow send_destination="com.{vendor}.komin.history"/>
    <allow send_destination="com.{vendor}.komin.user"/>
  </policy>
</busconfig>
