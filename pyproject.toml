[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "komin-terminal"
version = "1.0.0"
description = "AI-driven command line assistant for Linux system administration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "dasbus>=1.7",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "markdown>=3.5",
    "pyte>=0.8",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgresql = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tox>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-markdown",
    "sphinx>=7.0",
]

[project.scripts]
km = "komin_terminal.commands.cli:main"
komin = "komin_terminal.commands.cli:main"
komind = "komin_terminal.daemon.komind:main"

[tool.setuptools.packages.find]
include = ["komin_terminal*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["komin_terminal", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["dasbus.*", "gi.*", "pyte.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: 跨模块集成测试（仍然完全离线）",
    "slow: 耗时较长的测试",
]

[tool.coverage.run]
source = ["komin_terminal"]
